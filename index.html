<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#8bd6f5">
<title>Flappy Milena ✈️</title>
<style>
:root{--navy:#102a43;--blue:#2d83b5;--cream:#fff8e9;--gold:#ffc857;--mint:#b8e8d0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd6f5;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy);overscroll-behavior:none}body{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;background:linear-gradient(#83d5f5 0%,#d8f5ff 72%,#f5efd9 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:env(safe-area-inset-top) 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top)) 16px 0;pointer-events:none;gap:10px}.pill{background:#fff9e8eF;border:2px solid #fff;box-shadow:0 5px 0 #19456320;border-radius:18px;padding:8px 13px;font-weight:900;letter-spacing:.03em}.scorebox{text-align:center;min-width:76px}.scorebox small{display:block;font-size:10px;letter-spacing:.15em;color:#567184}.score{font-size:26px;line-height:1.05}.sound{pointer-events:auto;border:2px solid #fff;background:#fff9e8;color:var(--navy);font-size:18px;width:44px;height:44px;border-radius:15px;box-shadow:0 4px 0 #19456320}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;padding-top:calc(22px + env(safe-area-inset-top));padding-bottom:calc(22px + env(safe-area-inset-bottom));background:linear-gradient(#e9faff30,#102a4330);}.panel{width:min(100%,360px);text-align:center;background:var(--cream);border:3px solid #fff;border-radius:28px;padding:25px 23px 23px;box-shadow:0 10px 0 #164e6b2b,0 24px 60px #123a552b;position:relative}.stamp{display:inline-block;background:var(--mint);border:2px solid #fff;border-radius:99px;padding:6px 12px;font-size:11px;font-weight:900;letter-spacing:.14em;transform:rotate(-3deg);margin-bottom:10px}.plane{font-size:48px;line-height:1.15;filter:drop-shadow(0 4px 0 #ffc857)}h1{font-size:clamp(29px,8vw,39px);line-height:.98;letter-spacing:-.05em;margin:8px 0 12px;color:var(--navy)}p{margin:0 auto 18px;line-height:1.5;color:#557184;font-weight:650;font-size:14px;max-width:270px}.btn{border:0;width:100%;border-radius:16px;background:var(--gold);color:#16334a;font:900 16px inherit;padding:16px 18px;box-shadow:0 5px 0 #d99b32;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d99b32}.sub{font-size:11px;color:#78909e;margin-top:14px;font-weight:750;letter-spacing:.04em}.hidden{display:none!important}.tiny{font-size:11px;margin-top:14px;color:#78909e}
@media(min-width:700px){.hud{padding-left:24px;padding-right:24px}.panel{padding:30px 28px}.score{font-size:30px}}
</style>
</head>
<body>
<div id="app" aria-label="Gate to the Sky game">
<canvas id="game" aria-label="Tap or press space to fly through the airport"></canvas>
<div class="hud"><div class="pill">✈ GATE TO THE SKY</div><div class="pill scorebox"><small>FLIGHT SCORE</small><div class="score" id="score">0</div></div><button class="sound" id="sound" aria-label="Toggle sound">♫</button></div>
<div class="overlay" id="overlay"><section class="panel"><div class="stamp" id="stamp">YOUR LITTLE FLIGHT</div><div class="plane" id="panelPlane">🛫</div><h1 id="headline">Ready for<br>a little flight?</h1><p id="message">Take off, dodge the airport towers, and see how far your little pilot can fly.</p><button class="btn" id="play">LET'S FLY ✈</button><button class="btn hidden" id="home" style="margin-top:12px;background:#b8e8d0;box-shadow:0 5px 0 #7ebba0">Back to Airport</button><div class="sub" id="subline">TAP TO FLAP · A LITTLE GIFT JUST FOR YOU ❤</div></section></div>
</div>
<script>
(()=>{
'use strict';
// Milena's PNG portrait (place Millena.png beside this HTML file).
const PILOT_IMAGE = 'Millena.png';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),playBtn=document.getElementById('play'),homeBtn=document.getElementById('home'),scoreEl=document.getElementById('score'),headline=document.getElementById('headline'),message=document.getElementById('message'),stamp=document.getElementById('stamp'),panelPlane=document.getElementById('panelPlane'),subline=document.getElementById('subline'),soundBtn=document.getElementById('sound');
const pilotImg=new Image();let pilotReady=false;pilotImg.onload=()=>pilotReady=true;pilotImg.onerror=()=>{pilotReady=false;};pilotImg.src=PILOT_IMAGE;
let W=0,H=0,dpr=1,last=0,raf=0,state='ready',score=0,best=Number(localStorage.getItem('gateSkyBest')||0),soundOn=false,audioCtx=null,world=0,shake=0;
let player={x:0,y:0,vy:0,r:19,rot:0};let obstacles=[],particles=[];const gravity=1350,flap=-410,MIN_GAP=310,obstacleW=72;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);player.x=W*.28;if(state==='ready'||state==='over')player.y=H*.43;}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,150));
function rand(a,b){return a+Math.random()*(b-a)}
function start(){homeBtn.classList.add('hidden');score=0;scoreEl.textContent='0';obstacles=[];particles=[];world=0;shake=0;player={x:W*.28,y:H*.43,vy:0,r:Math.max(15,Math.min(20,W*.047)),rot:0};state='playing';overlay.classList.add('hidden');spawnObstacle(W+80);spawnObstacle(W+80+W*.56);flapUp();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function flapUp(){if(state!=='playing')return;player.vy=flap;for(let i=0;i<5;i++)particles.push({x:player.x-14,y:player.y+rand(-7,7),vx:rand(-100,-30),vy:rand(-50,50),life:rand(.2,.45),max:.45});if(soundOn)beep(540,.045)}
function spawnObstacle(x){
  // Keep the opening comfortably away from the ceiling and runway. The gap never
  // drops below 310 CSS pixels on normal mobile screens.
  const floor=H-groundHeight();
  const clearance=Math.max(player.r+24,42);
  const maxGap=Math.max(160,floor-2*clearance);
  const gap=Math.min(MIN_GAP,maxGap);
  const minCenter=clearance+gap/2;
  const maxCenter=Math.max(minCenter,floor-clearance-gap/2);
  const gapY=rand(minCenter,maxCenter);
  obstacles.push({x,gapY,gap,passed:false,seed:Math.random()});
}
function endGame(){if(state!=='playing')return;state='over';shake=8;if(score>best){best=score;try{localStorage.setItem('gateSkyBest',String(best))}catch(e){}}headline.innerHTML='Flight log:<br>'+score+' point'+(score===1?'':'s')+'!';message.textContent=score>=10?'Incredible flying. You were born for the skies. 💛':score>=4?'A lovely little flight. Ready to beat your record?':'Every great pilot starts somewhere. Fancy another take-off?';stamp.textContent='FLIGHT COMPLETE';panelPlane.textContent=score>=5?'🏆':'🛬';playBtn.textContent='FLY AGAIN ↻';homeBtn.classList.remove('hidden');subline.textContent="PERSONAL BEST: "+best+" · YOU'VE GOT THIS";overlay.classList.remove('hidden');if(soundOn)beep(180,.16)}
function beep(freq,dur){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.045,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
soundBtn.addEventListener('click',e=>{e.stopPropagation();soundOn=!soundOn;soundBtn.textContent=soundOn?'♫':'♪';soundBtn.style.background=soundOn?'#b8e8d0':'#fff9e8';if(soundOn)beep(660,.07)});
playBtn.addEventListener('click',e=>{e.stopPropagation();start()});
homeBtn.addEventListener('click',e=>{
  e.stopPropagation();
  state='ready';obstacles=[];particles=[];player.vy=0;player.rot=0;player.x=W*.28;player.y=H*.43;
  score=0;scoreEl.textContent='0';
  stamp.textContent='YOUR LITTLE FLIGHT';
  panelPlane.textContent='🛫';
  headline.innerHTML='Ready for<br>a little flight?';
  message.textContent='Take off, dodge the airport towers, and see how far your little pilot can fly.';
  playBtn.textContent="LET'S FLY ✈";
  subline.textContent='TAP TO FLAP · A LITTLE GIFT JUST FOR YOU ❤';
  homeBtn.classList.add('hidden');
  overlay.classList.remove('hidden');
  draw();
});
function action(e){if(e)e.preventDefault();if(state==='ready'||state==='over'){start();return}flapUp()}
canvas.addEventListener('pointerdown',action,{passive:false});document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();action()} });
function loop(t){if(state!=='playing')return;const dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){world+=dt*175;player.vy+=gravity*dt;player.y+=player.vy*dt;player.rot=Math.max(-.45,Math.min(1.15,player.vy/600));const speed=Math.min(255,175+score*2.2);for(const o of obstacles){o.x-=speed*dt;if(!o.passed&&o.x+obstacleW<player.x){o.passed=true;score++;scoreEl.textContent=score;if(soundOn)beep(780,.05);for(let i=0;i<8;i++)particles.push({x:player.x,y:player.y,vx:rand(-80,80),vy:rand(-100,30),life:.45,max:.45})}}while(obstacles.length&&obstacles[0].x+obstacleW<-10)obstacles.shift();if(obstacles.length<3)spawnObstacle(obstacles[obstacles.length-1].x+W*.56);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(player.y-player.r<0||player.y+player.r>H-groundHeight()||collides()){endGame()}}
function groundHeight(){return Math.max(52,H*.105)}
function collides(){
  // Use the player's full circular hitbox and a small safety margin at the
  // tower edges, rather than colliding with decorative roof/window artwork.
  const r=player.r*.72;
  const topSafe=o=>o.gapY-o.gap/2;
  const bottomSafe=o=>o.gapY+o.gap/2;
  for(const o of obstacles){
    if(player.x+r>o.x+8 && player.x-r<o.x+obstacleW-8){
      if(player.y-r<topSafe(o)+2 || player.y+r>bottomSafe(o)-2)return true;
    }
  }
  return false;
}
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,W,H);drawSky();drawAirport();for(const o of obstacles)drawTower(o);drawRunway();drawParticles();drawPlayer();if(shake>0)shake=Math.max(0,shake-.5)}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#79cef0');g.addColorStop(.65,'#d7f5ff');g.addColorStop(1,'#fff2d5');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff7d9';ctx.beginPath();ctx.arc(W*.78,H*.16,Math.min(36,W*.08),0,Math.PI*2);ctx.fill();for(let i=0;i<4;i++){const x=((i*W*.38-world*.18)%(W+180)+W+180)%(W+180)-80,y=H*(.13+(i%3)*.12);cloud(x,y,.75+(i%2)*.3)}}
function cloud(x,y,s){ctx.fillStyle='#ffffffb8';ctx.beginPath();ctx.ellipse(x,y,28*s,10*s,0,0,Math.PI*2);ctx.ellipse(x-13*s,y-6*s,13*s,13*s,0,0,Math.PI*2);ctx.ellipse(x+3*s,y-10*s,17*s,17*s,0,0,Math.PI*2);ctx.ellipse(x+20*s,y-3*s,14*s,11*s,0,0,Math.PI*2);ctx.fill()}
function drawAirport(){const horizon=H*.72;ctx.fillStyle='#b8ddca';ctx.fillRect(0,horizon,W,H-horizon);ctx.fillStyle='#8db8a9';for(let i=0;i<8;i++){const x=((i*100-world*.42)%(W+100)+W+100)%(W+100)-40;ctx.fillRect(x,horizon-25,45,25);ctx.fillRect(x+7,horizon-38,24,13)}
// Terminal: anchor the whole building to the horizon so it doesn't float.
const tx=W*.05,ty=horizon-82,terminalBase=horizon;
ctx.fillStyle='#f8f2df';ctx.beginPath();
ctx.moveTo(tx,terminalBase);ctx.lineTo(tx+W*.42,terminalBase);
ctx.lineTo(tx+W*.38,ty);ctx.lineTo(tx+W*.07,ty);
ctx.closePath();ctx.fill();
ctx.fillStyle='#68b5d0';
for(let i=1;i<8;i++)ctx.fillRect(tx+10+i*W*.047,ty+18,W*.027,Math.max(12,terminalBase-ty-24));
ctx.fillStyle='#fff8e9';ctx.fillRect(W*.43,terminalBase-22,W*.09,22);
ctx.fillStyle='#3f819a';ctx.fillRect(W*.48,terminalBase-32,3,32);
// little aircraft on the apron
ctx.save();ctx.translate(W*.69,horizon-23);ctx.scale(.7,.7);ctx.fillStyle='#f9ffff';ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-7,-3);ctx.lineTo(3,-15);ctx.lineTo(9,-15);ctx.lineTo(5,-3);ctx.lineTo(24,0);ctx.lineTo(28,4);ctx.lineTo(5,3);ctx.lineTo(8,11);ctx.lineTo(3,11);ctx.lineTo(-6,3);ctx.lineTo(-28,4);ctx.closePath();ctx.fill();ctx.restore()}
function drawTower(o){const top=o.gapY-o.gap/2,bottom=o.gapY+o.gap/2;drawControlTower(o.x,0,obstacleW,top,true,o.seed);drawControlTower(o.x,bottom,obstacleW,H-bottom-groundHeight(),false,o.seed)}
function drawControlTower(x,y,w,h,top,seed){if(h<5)return;ctx.save();ctx.shadowColor='#234c6025';ctx.shadowBlur=6;ctx.shadowOffsetY=3;const base='#e8e2d0',edge='#c4c7bb';ctx.fillStyle=base;ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.beginPath();if(top){ctx.moveTo(x+12,y);ctx.lineTo(x+w-12,y);ctx.lineTo(x+w-18,y+Math.min(h*.68,78));ctx.lineTo(x+18,y+Math.min(h*.68,78));}else{ctx.moveTo(x+18,y);ctx.lineTo(x+w-18,y);ctx.lineTo(x+w-7,y+h);ctx.lineTo(x+7,y+h)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowColor='transparent';const capY=top?y+Math.min(h*.68,78)-14:y+4;ctx.fillStyle='#244d68';roundRect(x+7,capY,w-14,14,3,'#244d68');ctx.fillStyle='#9ce6f5';for(let i=0;i<4;i++)ctx.fillRect(x+11+i*11,capY+3,7,7);ctx.fillStyle='#fff8e8';ctx.fillRect(x+w/2-3,top?y+Math.min(h*.68,78):y,6,Math.max(0,h-Math.min(h*.68,78)));if(h>45){ctx.fillStyle='#8eb6c0';for(let yy=top?y+Math.min(h*.68,78)+15:y+24;yy<y+h-8;yy+=21)ctx.fillRect(x+w/2-10,yy,20,5)}ctx.fillStyle='#e5b94e';ctx.fillRect(x+w/2-2,top?y-7:y+h-1,4,8);ctx.restore()}
function drawRunway(){const y=H-groundHeight();ctx.fillStyle='#879ca0';ctx.fillRect(0,y,W,groundHeight());ctx.fillStyle='#e8e4d4';ctx.fillRect(0,y,W,4);for(let i=0;i<9;i++){const x=((i*78-world*1.25)%(W+80)+W+80)%(W+80)-30;ctx.fillStyle='#fff8e8';ctx.fillRect(x,y+groundHeight()*.45,35,4)}ctx.fillStyle='#f5c85b';ctx.fillRect(0,y+groundHeight()*.83,W,3)}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.rot);ctx.shadowColor='#173d552b';ctx.shadowBlur=8;ctx.shadowOffsetY=4;if(pilotReady){ctx.save();ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.clip();ctx.drawImage(pilotImg,-player.r,-player.r,player.r*2,player.r*2);ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.stroke()}else{ctx.fillStyle='#ffc857';ctx.beginPath();ctx.ellipse(0,0,player.r*1.15,player.r*.86,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.shadowColor='transparent';ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-3,-2,player.r*.46,player.r*.4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#173d55';ctx.beginPath();ctx.arc(0,-2,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f18a64';ctx.beginPath();ctx.moveTo(player.r*.65,1);ctx.lineTo(player.r*1.5,5);ctx.lineTo(player.r*.65,8);ctx.fill();ctx.fillStyle='#f18a64';ctx.beginPath();ctx.ellipse(-player.r*.2,player.r*.65,player.r*.55,player.r*.2,-.2,0,Math.PI*2);ctx.fill()}ctx.restore()}
resize();draw();
})();
</script>
</body>
</html>
